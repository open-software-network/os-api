services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      API_KEY_HASHES: ${API_KEY_HASHES}
      MODEL_CONFIG_PATH: /app/config/models.self-hosted.yaml
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config/models.self-hosted.yaml:/app/config/models.self-hosted.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: valkey/valkey:8.1.8-alpine@sha256:94365b275456ae14621001c03556c732b1d93a0cdeacc317d1bdd52eba680885
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    read_only: true
    tmpfs:
      - /data

  standard-vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai@sha256:6d8429e38e3747723ca07ee1b17972e09bb9c51c4032b266f24fb1cc3b22ed8f
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - Qwen/Qwen2.5-0.5B-Instruct
      - --served-model-name=Qwen/Qwen2.5-0.5B-Instruct
      - --max-model-len=8192
      - --enable-prefix-caching
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
