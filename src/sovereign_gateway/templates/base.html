<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}OpenSoftware API{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <header class="nav shell">
      <a class="wordmark" href="/" aria-label="OpenSoftware API home">
        <span class="mark">OS</span><span>OpenSoftware</span><span class="api-tag">API</span>
      </a>
      <nav aria-label="Primary">
        <a href="/docs">Docs</a>
        <a href="/dashboard">Dashboard</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer class="shell footer">
      <span>Open models. Private infrastructure.</span>
      <a href="https://opensoftware.co">opensoftware.co</a>
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
