    owned_by: google
    max_context_length: 40000
    max_output_length: 16384
  qwen/qwen-2.5-7b-instruct:
    quality_score: 45
    owned_by: qwen
    max_context_length: 32000
    max_output_length: 32000
  deepseek/deepseek-v4-flash:
    quality_score: 76
    owned_by: deepseek
    max_context_length: 1000000
    max_output_length: 65536
    capabilities: [reasoning]
  z-ai/glm-5.2:
    quality_score: 94
    owned_by: z-ai
    max_context_length: 1000000
    max_output_length: 131072
    capabilities: [tools, tool_choice, structured_outputs, reasoning]
  qwen/qwen3.6-27b:
    quality_score: 84
    owned_by: qwen
    max_context_length: 256000
    max_output_length: 262140
    capabilities: [tools, reasoning]
  moonshotai/kimi-k2.6:
    quality_score: 92
    owned_by: moonshotai
    max_context_length: 262144
    max_output_length: 262144
    capabilities: [tools, tool_choice, structured_outputs, reasoning]

endpoints:
  phala-gpt-oss-20b:
    model: openai/gpt-oss-20b
    provider: phala
    upstream_model: openai/gpt-oss-20b
    priority: 10
    capabilities: [tools, tool_choice, structured_outputs, reasoning]
    privacy:
      level: tee
      execution: gpu-tee
      retention: zero
      attestation: phala-aci-receipt
      transport: tee-terminated-tls
    pricing:
      input_per_million_usd: 0.04
      output_per_million_usd: 0.15
  venice-gpt-oss-20b-e2ee:
    model: openai/gpt-oss-20b
    provider: venice
    upstream_model: e2ee-gpt-oss-20b-p
    priority: 20
    requires_client_encryption: true
    capabilities: [reasoning]
    privacy:
      level: e2ee-tee
      execution: gpu-tee
      retention: zero
      attestation: venice-tee-signature
      transport: client-e2ee
    pricing:
      input_per_million_usd: 0.05
