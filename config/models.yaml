providers:
  phala:
    name: Phala Confidential AI
    base_url: https://inference.phala.com
    api_key_env: PHALA_API_KEY
    adapter: phala
    regions: [global]
  venice:
    name: Venice E2EE
    base_url: https://api.venice.ai/api
    api_key_env: VENICE_API_KEY
    adapter: venice
    regions: [global]

models:
  openai/gpt-oss-20b:
    quality_score: 58
    owned_by: openai
    max_context_length: 128000
    max_output_length: 128000
    capabilities: [reasoning]
  openai/gpt-oss-120b:
    quality_score: 78
    owned_by: openai
    max_context_length: 128000
    max_output_length: 128000
    capabilities: [reasoning]
  google/gemma-3-27b-it:
