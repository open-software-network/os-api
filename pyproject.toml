[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "os-api"
version = "0.10.0"
description = "An OpenAI-compatible router for policy-enforced private model inference"
readme = "README.md"
license = "MIT"
license-files = ["AUTHORS.md", "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Open Software Network" }]
requires-python = ">=3.11"
keywords = ["ai", "confidential-computing", "inference", "openai", "privacy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "fastapi>=0.115,<1",
  "google-cloud-firestore>=2.20,<3",
  "google-cloud-secret-manager>=2.24,<3",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "redis>=5.2,<6",
  "uvicorn[standard]>=0.34,<1",
]

[project.urls]
Homepage = "https://opensoftware.co"
Documentation = "https://github.com/open-software-network/os-api/tree/main/docs"
Issues = "https://github.com/open-software-network/os-api/issues"
Repository = "https://github.com/open-software-network/os-api"
Security = "https://github.com/open-software-network/os-api/security/policy"

[project.optional-dependencies]
dev = [
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign_gateway"]

[tool.hatch.build.targets.wheel.force-include]
"config/models.yaml" = "sovereign_gateway/data/models.yaml"

[tool.hatch.build.targets.sdist]
exclude = ["/.gitignore"]
include = [
  "/config/models.yaml",
  "/AUTHORS.md",
  "/LICENSE",
  "/NOTICE",
  "/pyproject.toml",
  "/README.md",
  "/src/sovereign_gateway",
  "/THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
