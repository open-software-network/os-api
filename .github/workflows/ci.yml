name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python, catalog, and image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/validate_provider_catalog.py
      - run: uv run pip-audit
      - run: uv build --no-sources
      - run: shellcheck scripts/*.sh
      - run: docker build -t os-api:test .
      - run: docker build -f deploy/attestation-agent/Dockerfile -t os-api-attestation:test .

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
      - run: kubectl kustomize deploy/kubernetes/base > /tmp/rendered.yaml
      - run: kubectl kustomize deploy/kubernetes/overlays/public-live > /tmp/public-live.yaml
      - run: kubectl kustomize deploy/kubernetes/overlays/public-live-east > /tmp/public-live-east.yaml
      - run: kubectl kustomize deploy/kubernetes/overlays/standard-smoke > /tmp/standard-smoke.yaml
