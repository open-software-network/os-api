name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: os-api-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: autonomous-lab-490610
  REGION: us-central1
  SERVICE: sovereign-api
  IMAGE: us-central1-docker.pkg.dev/autonomous-lab-490610/sovereign-inference/gateway

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker buildx build \
            --platform linux/amd64 \
            --provenance=true \
            --sbom=true \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --push \
            .
          digest="$(gcloud artifacts docker images describe "${IMAGE}:${GITHUB_SHA}" --format='value(image_summary.digest)')"
          test -n "${digest}"
          echo "reference=${IMAGE}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Deploy candidate without traffic
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          suffix="gh-${GITHUB_SHA:0:8}"
          revision="${SERVICE}-${suffix}"
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${{ steps.image.outputs.reference }}" \
            --revision-suffix "${suffix}" \
            --no-traffic \
            --tag candidate \
            --quiet
          candidate_url="$(gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')"
          test -n "${candidate_url}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "url=${candidate_url}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test candidate
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        run: |
          set -euo pipefail
          smoke_key="$(gcloud secrets versions access latest \
            --project "${PROJECT_ID}" \
            --secret smoke-client-api-key)"
          echo "::add-mask::${smoke_key}"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 "${CANDIDATE_URL}/readyz" >/dev/null; then
              break
            fi
            if [[ "${attempt}" == "12" ]]; then
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${smoke_key}" \
            "${CANDIDATE_URL}/v1/models" \
            | jq -e '.object == "list" and (.data | length > 0)' >/dev/null

      - name: Promote candidate
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --to-revisions "${{ steps.candidate.outputs.revision }}=100" \
            --quiet

      - name: Verify public endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 https://api.opensoftware.co/readyz \
            | jq -e '.status == "ready"' >/dev/null
