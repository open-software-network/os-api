apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - vllm-confidential-cpu.yaml
  - vllm-standard-internal.yaml

images:
  - name: us-central1-docker.pkg.dev/PROJECT_ID/sovereign-inference/gateway
    newName: us-central1-docker.pkg.dev/autonomous-lab-490610/sovereign-inference/gateway
    digest: sha256:fca81181a16d51cf98c4caa107874ac352708d2985d738afeaebce797cb3f08b

patches:
  - target:
      kind: Deployment
      name: confidential-vllm
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: confidential-vllm
  - target:
      kind: Service
      name: confidential-vllm
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: confidential-vllm
  - target:
      kind: ConfigMap
      name: gateway-models
    patch: |-
      - op: replace
        path: /data/models.yaml
        value: |
          backends:
            standard-vllm:
              base_url: http://standard-vllm:8000
              privacy: standard
              revision: vllm-openai@6d8429e38e37
              max_concurrency: 8
            confidential-vllm-cpu:
              base_url: http://confidential-vllm-cpu:8000
              privacy: confidential
              revision: vllm-openai-cpu@89e1fbe82903
              max_concurrency: 8
          models:
            qwen2.5-0.5b-instruct:
              upstream_model: Qwen/Qwen2.5-0.5B-Instruct
              standard_backend: standard-vllm
              confidential_backend: confidential-vllm-cpu
              owned_by: self-hosted
              max_context_length: 32768
              input_price_microusd_per_million: 100000
              output_price_microusd_per_million: 200000
  - target:
      kind: Deployment
      name: standard-vllm
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - Qwen/Qwen2.5-0.5B-Instruct
          - --served-model-name=Qwen/Qwen2.5-0.5B-Instruct
          - --enable-prefix-caching
          - --max-model-len=32768
          - --enable-auto-tool-choice
          - --tool-call-parser=hermes
