apiVersion: v1
kind: Service
metadata:
  name: standard-vllm-internal
  namespace: inference
  annotations:
    networking.gke.io/load-balancer-type: Internal
    networking.gke.io/internal-load-balancer-allow-global-access: "true"
spec:
  selector:
    app: standard-vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-private-vpc-to-standard-vllm
  namespace: inference
spec:
  podSelector:
    matchLabels:
      app: standard-vllm
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.20.0.0/20
        - ipBlock:
            # us-east4 gateway subnet; internal passthrough LB preserves source IP
            cidr: 10.30.0.0/24
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: confidential-vllm-cpu-internal
  namespace: inference
  annotations:
