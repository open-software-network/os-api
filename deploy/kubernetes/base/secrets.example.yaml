# Example only. Prefer the GKE Secret Manager add-on; never commit populated secrets.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: inference
type: Opaque
stringData:
  api-key-hashes: "tenant-id=sha256-digest"
  # With Memorystore transit encryption/auth enabled:
  # rediss://default:AUTH_STRING@REDIS_PRIVATE_IP:6378/0
  redis-url: "rediss://default:replace@10.0.0.1:6378/0"
  redis-ca.pem: |
    -----BEGIN CERTIFICATE-----
    replace-with-terraform-redis-ca-cert-output
    -----END CERTIFICATE-----
  huggingface-token: "replace-with-token-after-accepting-model-license"
