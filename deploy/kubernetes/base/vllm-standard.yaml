apiVersion: apps/v1
kind: Deployment
metadata:
  name: standard-vllm
  namespace: inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: standard-vllm
  template:
    metadata:
      labels:
        app: standard-vllm
        compute-privacy: standard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: dedicated
          operator: Equal
          value: standard-gpu
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai@sha256:6d8429e38e3747723ca07ee1b17972e09bb9c51c4032b266f24fb1cc3b22ed8f
          args:
            - meta-llama/Llama-3.1-8B-Instruct
            - --served-model-name=meta-llama/Llama-3.1-8B-Instruct
            - --enable-prefix-caching
            - --max-model-len=8192
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: huggingface-token
            - name: HOME
              value: /home/vllm
            - name: HF_HOME
              value: /home/vllm/.cache/huggingface
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: "6"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 30Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: model-cache
              mountPath: /home/vllm/.cache/huggingface
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: model-cache
          emptyDir:
            sizeLimit: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: standard-vllm
  namespace: inference
spec:
  selector:
    app: standard-vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
